<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tabi · הטיול ליפן</title>
    <meta name="description" content="ניהול טיול של 30 יום ביפן: לו״ז יומי, מפה חיה וניווט." />

    <!-- Browser chrome / status bar colors follow the app theme -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />

    <!-- Standalone (home-screen) mode on iOS: content draws under the status bar; safe areas handled in CSS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tabi" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Fonts: Inter renders Latin text, Heebo renders Hebrew (see --font-sans in src/index.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&family=Inter:wght@300..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
